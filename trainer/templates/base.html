<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}YOLOv7 Eğitim Paneli{% endblock %}</title>
    {% load static %}
  <link rel="stylesheet" href="{% static 'trainer/style.css' %}">

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    nav {
      margin-bottom: 20px;
    }
    nav a {
      margin-right: 15px;
      text-decoration: none;
      font-weight: bold;
      color: #007bff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: #fff;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }
    th {
      background-color: #f0f0f0;
    }
    .message {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .message.success {
      background-color: #d4edda;
      color: #155724;
    }
    .message.error {
      background-color: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>

  <nav>
    <a href="{% url 'trainer:project_list' %}">🏁 Projeler</a>
    <a href="{% url 'trainer:train_view' %}">🎓 Eğitim Başlat</a>
    <a href="{% url 'trainer:training_result_list' %}">📊 Eğitim Sonuçları</a>
  </nav>

  {% if messages %}
    {% for message in messages %}
      <div class="message {{ message.tags }}">{{ message }}</div>
    {% endfor %}
  {% endif %}

  {% block content %}
  <!-- Sayfaya özel içerik buraya gelir -->
  {% endblock %}

</body>
</html>
